<div class="min-h-screen flex bg-white font-sans">
  <!-- LEFT (70%): Branding panel, hidden on mobile/tablet -->
  <div
    class="hidden lg:flex lg:w-[70%] relative overflow-hidden bg-linear-to-br from-indigo-700 via-indigo-600 to-blue-600 text-white"
  >
    <!-- Decorative circles -->
    <div class="absolute -top-24 -left-24 h-72 w-72 rounded-full bg-white/10"></div>
    <div
      class="absolute bottom-0 right-0 h-96 w-96 translate-x-1/3 translate-y-1/3 rounded-full bg-white/10"
    ></div>
    <div class="absolute top-1/2 left-1/3 h-40 w-40 rounded-full bg-white/5"></div>

    <div class="relative z-10 flex flex-col justify-between p-12 xl:p-16 w-full"></div>
  </div>

  <!-- RIGHT (30%): Login form -->
  <div class="flex w-full lg:w-[30%] lg:min-w-85 items-center justify-center px-5 py-10 sm:px-8">
    <div class="w-full max-w-sm">
      <div class="mb-6">
        <h1 class="text-4xl font-bold text-gray-900">Sign in</h1>
        <p class="mt-1.5 text-md text-gray-600">Welcome back! Please enter your details.</p>
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" novalidate>
        <!-- Email -->
        <div>
          <label for="email" class="block text-[15px] font-medium text-gray-700 mb-1.5"
            >Email
          </label>
          <input
            id="email"
            type="email"
            formControlName="email"
            autocomplete="email"
            placeholder="you@company.com"
            [attr.aria-invalid]="showError('email')"
            aria-describedby="email-error"
            class="app-control block w-full rounded-lg border px-3.5 text-sm text-gray-900 placeholder-gray-400 transition focus:outline-none focus:ring-2"
            [ngClass]="
              showError('email')
                ? 'border-red-500 focus:border-red-500 focus:ring-red-200'
                : 'border-gray-300 focus:border-indigo-500 focus:ring-indigo-200'
            "
          />
          <!-- Reserved height: layout stays fixed whether or not an error shows -->
          <div class="h-6 pt-1">
            <p *ngIf="showError('email')" id="email-error" class="text-xs text-red-600 truncate">
              {{ getError('email') }}
            </p>
          </div>
        </div>

        <!-- Password -->
        <div>
          <label for="password" class="block text-[15px] font-medium text-gray-700 mb-1.5"
            >Password</label
          >
          <div class="relative">
            <input
              id="password"
              [type]="showPassword ? 'text' : 'password'"
              formControlName="password"
              autocomplete="current-password"
              placeholder="Enter your password"
              [attr.aria-invalid]="showError('password')"
              aria-describedby="password-error"
              class="app-control block w-full rounded-lg border px-3.5 pr-11 text-sm text-gray-900 placeholder-gray-400 transition focus:outline-none focus:ring-2"
              [ngClass]="
                showError('password')
                  ? 'border-red-500 focus:border-red-500 focus:ring-red-200'
                  : 'border-gray-300 focus:border-indigo-500 focus:ring-indigo-200'
              "
            />
            <button
              type="button"
              (click)="showPassword = !showPassword"
              class="absolute inset-y-0 right-0 flex items-center px-3 text-gray-500 hover:text-gray-700 focus:outline-none cursor-pointer"
              [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
            >
              <svg
                *ngIf="!showPassword"
                class="h-5 w-5"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
                stroke-width="2"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
                />
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"
                />
              </svg>
              <svg
                *ngIf="showPassword"
                class="h-5 w-5"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
                stroke-width="2"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"
                />
              </svg>
            </button>
          </div>
          <div class="h-6 pt-1">
            <p
              *ngIf="showError('password')"
              id="password-error"
              class="text-xs text-red-600 truncate"
            >
              {{ getError('password') }}
            </p>
          </div>
        </div>

        <!-- Submit -->
        <button
          type="submit"
          [disabled]="isLoading()"
          class="app-control mt-6 w-full flex cursor-pointer items-center justify-center gap-2 rounded-lg bg-indigo-600 px-4 text-sm font-semibold text-white transition hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-60"
        >
          <svg *ngIf="isLoading()" class="h-4 w-4 animate-spin" fill="none" viewBox="0 0 24 24">
            <circle
              class="opacity-25"
              cx="12"
              cy="12"
              r="10"
              stroke="currentColor"
              stroke-width="4"
            ></circle>
            <path
              class="opacity-75"
              fill="currentColor"
              d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"
            ></path>
          </svg>
          {{ isLoading() ? 'Signing in...' : 'Sign in' }}
        </button>
      </form>
    </div>
  </div>
</div>
