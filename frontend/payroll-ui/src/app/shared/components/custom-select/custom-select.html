<div class="relative" #wrapper>
  <button
    type="button"
    (click)="toggle()"
    [disabled]="isDisabled()"
    [attr.aria-expanded]="isOpen()"
    [attr.aria-haspopup]="'listbox'"
    [attr.aria-invalid]="invalid() ? 'true' : null"
    class="app-control flex w-full cursor-pointer items-center justify-between gap-2 rounded-lg border bg-white px-3 text-left text-sm transition-all outline-none"
    [class]="
      invalid()
        ? 'border-red-400 focus:border-red-500 focus:ring-2 focus:ring-red-200'
        : isOpen()
          ? 'border-indigo-500 ring-2 ring-indigo-200'
          : 'border-gray-200 hover:border-indigo-300 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200'
    "
    [class.opacity-50]="isDisabled()"
    [class.cursor-not-allowed]="isDisabled()"
  >
    <span class="truncate" [class]="value() ? 'text-gray-900' : 'text-gray-400'">
      {{ selectedLabel() }}
    </span>
    <app-icon
      name="chevron-down"
      class="h-4 w-4 shrink-0 text-gray-400 transition-transform duration-200"
      [class.rotate-180]="isOpen()"
    />
  </button>

  @if (isOpen()) {
    <div
      class="emp-select-panel absolute z-30 mt-2 max-h-60 w-full overflow-y-auto rounded-xl border border-gray-200 bg-white p-1.5 shadow-lg"
      role="listbox"
    >
      @for (option of options(); track option.value) {
        <button
          type="button"
          (click)="select(option)"
          role="option"
          [attr.aria-selected]="value() === option.value"
          class="flex w-full cursor-pointer items-center justify-between gap-2 rounded-lg px-2.5 py-2 text-left text-sm transition-colors"
          [class]="
            value() === option.value
              ? 'bg-indigo-50 font-medium text-indigo-700'
              : 'text-gray-700 hover:bg-gray-100'
          "
        >
          <span class="truncate">{{ option.label }}</span>
          @if (value() === option.value) {
            <app-icon name="check" class="h-3.5 w-3.5 shrink-0 text-indigo-600" [strokeWidth]="3" />
          }
        </button>
      }
    </div>
  }
</div>
