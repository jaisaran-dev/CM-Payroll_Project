spring.application.name=payroll-api

# TiDB Cloud Database Connection
spring.datasource.url=jdbc:mysql://gateway01.ap-southeast-1.prod.aws.tidbcloud.com:4000/payroll_db?sslMode=VERIFY_IDENTITY&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.community.dialect.TiDBDialect

# JWT Configuration
app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-expiration=1800000
app.jwt.refresh-token-expiration=604800000
server.port=${PORT:8080}
